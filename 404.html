<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Sinonimia</title>
  <meta name="robots" content="noindex">
  <!-- No meta refresh: sinonimia uses a hash router (#/es/, #/en/).
       The JS below redirects to index.html which restores the user's
       language from localStorage / navigator.language. -->
  <style>
    :root {
      --color-bg: #FAF7F2;
      --color-surface: #FFFFFF;
      --color-text: #1A1A2E;
      --color-text-soft: #4A4A68;
      --color-border: #D8D2C8;
      --color-accent: #0a5c78;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      color: var(--color-text);
      background: var(--color-bg);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }
    h1 { font-size: 28px; margin-bottom: 16px; letter-spacing: -0.02em; }
    p { color: var(--color-text-soft); margin-bottom: 24px; }
    a {
      display: inline-block;
      background: var(--color-accent);
      color: #fff;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      min-height: 56px;
      line-height: 28px;
    }
    a:hover { text-decoration: none; opacity: 0.92; }
    :focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Página no encontrada</h1>
    <p>La ruta que has visitado no existe. La página principal de Sinonimia sigue disponible.</p>
    <a href="./">Volver a Sinonimia</a>
  </main>
  <script src="js/sw-register.js"></script>
  <script>
  // Hash-router apps: redirect to index.html which restores the user's
  // language from localStorage / navigator.language (same logic as the
  // initialLanguage() path in app.js). Using index.html instead of ./
  // avoids a loop on hosts that serve 404.html for any missing path.
  var saved = localStorage.getItem('currentLanguage');
  var lang = saved || navigator.language || 'es';
  if (!saved && lang.startsWith('en')) lang = 'en';
  else if (!saved) lang = 'es';
  window.location.replace('index.html#/' + lang + '/');
  </script>
</body>
</html>
