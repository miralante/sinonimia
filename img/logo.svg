<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sinonimia">
  <title>Sinonimia</title>
  <!-- Background: rounded square in brand blue (#0a5c78). -->
  <rect width="100" height="100" rx="20" fill="#0a5c78"/>
  <!-- Stylised "S". Two opposing semicircles that share the vertical axis:
       top arc opens leftward, bottom arc opens rightward. Together they
       read as the letter S and as a synonym/definition mirror image. -->
  <path d="M70 32
           A18 18 0 0 0 52 14
           H48
           A18 18 0 0 0 48 50
           H52
           A18 18 0 0 1 52 86
           H48
           A18 18 0 0 1 30 68"
        fill="none" stroke="#fbfaf7" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>