# wrangler.toml — Cloudflare Workers (static assets) configuration for
# Sinonimia.
#
# Sinonimia is a fully static site (plain HTML/CSS/JS, no build step, no
# server-side code), so it's deployed as a Worker with no `main` script —
# just a static-assets binding. This is Cloudflare's current recommended
# path for static sites (the classic "Pages" product is being superseded by
# Workers + static assets); it's also what the existing "sinonimia" resource
# in the Cloudflare dashboard already is — a Worker with "Workers Builds"
# connected to GitHub, not a Pages project. `wrangler pages deploy` /
# a Pages-style wrangler.toml (`pages_build_output_dir`) do not apply here.
#
# See: https://developers.cloudflare.com/workers/static-assets/

name = "sinonimia"
compatibility_date = "2026-07-27"

[assets]
directory = "."
# Serve 404.html for any path that isn't a static asset, instead of
# Cloudflare's default JSON 404 — the app itself never needs server-side
# routing (js/app.js is a client-side hash router).
not_found_handling = "404-page"
