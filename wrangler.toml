# wrangler.toml — Cloudflare Pages configuration for Sinonimia.
#
# Sinonimia is a fully static site (plain HTML/CSS/JS, no build step). On
# Cloudflare Pages, only two fields in this file are read:
#   * `name`                  — the Pages project name (must match the
#                               project that the GitHub integration is
#                               connected to in the Cloudflare dashboard).
#   * `pages_build_output_dir` — directory to publish. The repo root for
#                                us; Cloudflare's default is `./public`,
#                                which is why this file is needed.
#
# `pages_build_include` / `pages_build_exclude` (introduced in newer
# Wrangler versions) are intentionally NOT used here: pinning the deploy
# step to a specific Wrangler minor version in the workflow is enough,
# and keeping this file minimal avoids "Unexpected fields" warnings that
# older Wrangler clients on shared CI runners turn into 8000007 errors.
#
# See: https://developers.cloudflare.com/pages/configuration/build-configuration/

name = "sinonimia"
pages_build_output_dir = "."
