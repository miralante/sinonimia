name: Smoke test (production)

# Checks the LIVE deployed site, not the repo — catches drift between
# index.html and js/i18n.js caused by CDN/browser caching that
# scripts/check.js structurally can't see (it only checks the source
# tree). See scripts/smoke-prod.js for what triggered this.
#
# Runs on a schedule rather than only after deploy because the failure
# mode is caching going stale over time, not just at deploy time — and
# Cloudflare Workers Builds deploys outside this workflow, so there's no
# reliable "deploy finished" event to hook here.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/smoke-prod.js
